# 账号日志
accounts_log: "/app/data/accounts_all.txt"

# 5SIM 接码 (留空=遇到手机验证跳过)
fivesim:
  api_key: ""
  country: ""
  operator: "any"
  max_price: 50

# 浏览器
headless: true
